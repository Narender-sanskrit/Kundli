@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10142a;--fg:#e8ecfa;--card:#1a2040;--ac:#8fa2ff;--hi:#ffc83d;--bd:#34406e;--mu:#9aa6d0}}
:root[data-theme="dark"]{--bg:#10142a;--fg:#e8ecfa;--card:#1a2040;--ac:#8fa2ff;--hi:#ffc83d;--bd:#34406e;--mu:#9aa6d0}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 system-ui,"Noto Sans Devanagari","Mangal",sans-serif}
main{max-width:760px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.2rem 0 .8rem}
h2{font-size:1.1rem;margin:1rem 0 .4rem}
fieldset{border:1px solid var(--bd);border-radius:6px;background:var(--card);margin:0 0 12px;padding:10px 12px}
legend{font-weight:600;padding:0 6px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
label{display:block;font-size:.8rem;color:var(--mu)}
input,select{width:100%;padding:7px;border:1px solid var(--bd);border-radius:4px;background:var(--bg);color:var(--fg);font:inherit}
button{font:inherit;cursor:pointer;border:1px solid var(--ac);background:var(--ac);color:var(--bg);padding:8px 16px;border-radius:4px}
button:focus-visible,input:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.tabs{display:flex;gap:6px;overflow-x:auto;margin:14px 0 8px}
.tabs button{background:transparent;color:var(--ac);white-space:nowrap}
.tabs button.on{background:var(--ac);color:var(--bg)}
.w{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{border-bottom:1px solid var(--bd);padding:5px 6px;text-align:left;white-space:nowrap}
th{color:var(--mu);font-weight:600}
.ch{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,86px);max-width:380px;border:2px solid var(--ac);margin:8px 0}
.ch>div{border:1px solid var(--bd);padding:3px;font-size:.78rem;line-height:1.25;background:var(--card)}
.ch small{color:var(--mu);display:block}
.ch .lg{box-shadow:inset 0 0 0 2px var(--hi)}
.ch .ct{grid-area:2/2/4/4;display:flex;align-items:center;justify-content:center;text-align:center;font-weight:600;color:var(--ac)}
details{border-bottom:1px solid var(--bd);padding:4px 0}
summary{cursor:pointer}
.big{font-size:1.6rem;font-weight:700;color:var(--ac)}
.note{color:var(--mu);font-size:.8rem}
.pane{display:none}.pane.on{display:block}

function offs(tz,y,m,d,h,mi){const f=new Intl.DateTimeFormat("en-US",{timeZone:tz,hourCycle:"h23",year:"numeric",month:"numeric",day:"numeric",hour:"numeric",minute:"numeric"});
 const g=u=>{const p=Object.fromEntries(f.formatToParts(new Date(u)).map(x=>[x.type,x.value]));return Date.UTC(p.year,p.month-1,p.day,p.hour,p.minute)-u};

function calc(q){
 const [y,m,d]=q.d.split("-").map(Number),[h,mi]=q.t.split(":").map(Number);
 const z=(q.z===null&&q.tz)?offs(q.tz,y,m,d,h,mi):(q.z===null?5.5:q.z), utc=new Date(Date.UTC(y,m-1,d,h,mi)-z*36e5), t=Astronomy.MakeTime(utc), T=t.tt/36525;
 const ay=23.85306+1.39697*T, tr={};
 tr.Su=Astronomy.SunPosition(t).elon; tr.Mo=Astronomy.EclipticGeoMoon(t).lon;
 for(const [k,b] of [["Ma","Mars"],["Me","Mercury"],["Ju","Jupiter"],["Ve","Venus"],["Sa","Saturn"]])

 const rad=Math.PI/180, ra=norm(Astronomy.SiderealTime(t)*15+q.lon)*rad, ep=Astronomy.e_tilt(t).tobl*rad, la=q.lat*rad;

 const s={Lg:norm(asc-ay)}; for(const k of PL)s[k]=norm(tr[k]-ay);
 return {n:q.n,z,utc,s,ay,moon:s.Mo,rs:Math.floor(s.Mo/30),nk:Math.floor(s.Mo/NW)};
}

const VIM=[["Ke",7],["Ve",20],["Su",6],["Mo",10],["Ma",7],["Ra",18],["Ju",16],["Sa",19],["Me",17]];

const AG=[["Su",4],["Mo",3],["Ma",4],["Me",3],["Sa",2],["Ju",4],["Ra",3],["Ve",4]]; // आर्द्रा से, अभिजित छोड़कर
function dasha(seq,i0,fr,tot,b){
 const Y=365.25*864e5;let t=b.getTime()-fr*seq[i0][1]*Y,o=[];
 for(let k=0;k<seq.length;k++){const i=(i0+k)%seq.length,[pl,yr]=seq[i],s=t;t+=yr*Y;
  let u=s,ad=[];for(let j=0;j<seq.length;j++){const [p2,y2]=seq[(i+j)%seq.length],du=yr*y2/tot*Y;ad.push([p2,u,u+du]);u+=du}
  o.push({pl,s,e:t,ad})}
 return o}
function vim(c){const f=(c.moon%NW)/NW;return dasha(VIM,c.nk%9,f,120,c.utc)}

 for(let i=0;i<8;i++){const w=AG[i][1]*NW;if(m<cum+w)return dasha(ASH,i,(m-cum)/w,108,c.utc);cum+=w}}
function dtab(D,b){const now=Date.now();
 return D.map(x=>`<details${now>=x.s&&now<x.e?" open":""}><summary><b>${P[x.pl]}</b> महादशा: ${fd(Math.max(x.s,b))} से ${fd(x.e)}${now>=x.s&&now<x.e?" (वर्तमान)":""}</summary>
 <div class="w"><table>${x.ad.filter(a=>a[2]>b).map(a=>`<tr><td>${P[x.pl]}-${P[a[0]]}</td><td>${fd(Math.max(a[1],b))}</td><td>${fd(a[2])}</td></tr>`).join("")}</table></div></details>`).filter((_,i)=>D[i].e>b).join("")}

// ---- varga ----
function vg(x,v){const s=Math.floor(x/30),d=x%30,od=s%2==0;
 if(v==1)return s;
 if(v==2)return (d<15)==od?4:3;
 if(v==3)return (s+4*Math.floor(d/10))%12;
 if(v==9)return ([s,s+8,s+4][s%3]+Math.floor(d/(30/9)))%12;
 if(v==12)return (s+Math.floor(d/2.5))%12;
 const L=od?[[5,0],[10,10],[18,8],[25,2],[30,6]]:[[5,1],[12,5],[20,11],[25,9],[30,7]];
 return L.find(l=>d<l[0])[1]}

// ---- chart ----
const POS={11:[1,1],0:[1,2],1:[1,3],2:[1,4],3:[2,4],4:[3,4],5:[4,4],6:[4,3],7:[4,2],8:[4,1],9:[3,1],10:[2,1]};
function chart(c,v){const lg=vg(c.s.Lg,v),h={};
 for(const k of ["Lg",...PL]){const r=vg(c.s[k],v);(h[r]=h[r]||[]).push(k=="Lg"?"ल":PS[k])}
 let o='<div class="ch">';
 for(let r=0;r<12;r++)o+=`<div class="${r==lg?"lg":""}" style="grid-area:${POS[r][0]}/${POS[r][1]}"><small>${R[r]}</small>${(h[r]||[]).join(" ")}</div>`;
 return o+`<div class="ct">${VN[v]}</div></div>`}


// ---- North Indian chart ----
const HC=[[150,78],[75,36],[34,76],[75,150],[34,224],[75,264],[150,222],[225,264],[266,224],[225,150],[266,76],[225,36]];
function nchart(c,v){const lg=vg(c.s.Lg,v),h=Array.from({length:12},()=>[]);
 for(const k of PL)h[(vg(c.s[k],v)-lg+12)%12].push(PS[k]);
 let o=`<svg viewBox="0 0 300 300" role="img" aria-label="उत्तर भारतीय ${VN[v]}" style="max-width:380px;width:100%;display:block;margin:8px 0"><g fill="var(--card)" stroke="var(--ac)" stroke-width="2"><rect x="1" y="1" width="298" height="298"/><path d="M1 1L299 299M299 1L1 299M150 1L299 150L150 299L1 150Z" fill="none"/></g>`;
 for(let i=0;i<12;i++){const [x,y]=HC[i],r=(lg+i)%12+1;
  o+=`<text x="${x}" y="${y-13}" text-anchor="middle" font-size="10" fill="var(--mu)">${r}</text><text x="${x}" y="${y+3}" text-anchor="middle" font-size="12" fill="var(--fg)">${h[i].join(" ")}</text>`}
 return o+`<text x="150" y="${HC[0][1]+17}" text-anchor="middle" font-size="10" fill="var(--hi)" font-weight="700">लग्न</text></svg>`}

// ---- milan ----
const LORD=["Ma","Ve","Me","Mo","Su","Me","Ve","Ma","Ju","Sa","Sa","Ju"];
const FR={Su:"Mo Ma Ju",Mo:"Su Me",Ma:"Su Mo Ju",Me:"Su Ve",Ju:"Su Mo Ma",Ve:"Me Sa",Sa:"Me Ve"};
const EN={Su:"Ve Sa",Mo:"",Ma:"Me",Me:"Mo",Ju:"Me Ve",Ve:"Su Mo",Sa:"Su Mo Ma"};
const rel=(a,b)=>FR[a].includes(b)?1:EN[a].includes(b)?-1:0;
const VARNA=[2,1,0,3,2,1,0,3,2,1,0,3];
const VAS=[0,0,1,2,3,1,1,4,1,0,1,2];
const VM=[[2,1,1,.5,1],[1,2,.5,0,1],[1,.5,2,1,1],[0,0,0,2,0],[1,1,1,0,2]];
const YO="Ho El Go Sn Sn Do Ca Go Ca Ra Ra Co Bu Ti Bu Ti De De Do Mo Mg Mo Li Ho Li Co El".split(" ");
const YE=["CoTi","ElLi","HoBu","DoDe","SnMg","MoGo","RaCa"];
const GA=[0,1,2,1,0,1,0,0,2,2,1,1,0,2,0,2,0,2,2,1,1,0,2,2,1,1,0];
const GM=[[6,6,1],[5,6,0],[1,0,6]];
function milan(g,b){const o=[];
 const add=(n,s,mx,i)=>o.push([n,s,mx,i]);
 add("वर्ण",VARNA[g.rs]>=VARNA[b.rs]?1:0,1,"");
 add("वश्य",VM[VAS[g.rs]][VAS[b.rs]],2,"");
 const t1=((g.nk-b.nk+27)%27)%9+1,t2=((b.nk-g.nk+27)%27)%9+1,bad=[3,5,7];
 add("तारा",(bad.includes(t1)?0:1.5)+(bad.includes(t2)?0:1.5),3,"");
 const y1=YO[g.nk],y2=YO[b.nk];
 add("योनि",y1==y2?4:YE.some(e=>e.includes(y1)&&e.includes(y2))?0:2,4,y1==y2?"समान":"");
 const l1=LORD[g.rs],l2=LORD[b.rs],sm=rel(l1,l2)+rel(l2,l1);
 add("ग्रह मैत्री",l1==l2?5:sm==2?5:sm==1?4:sm==-1?.5:sm==-2?0:(rel(l1,l2)==0?3:1),5,P[l1]+" / "+P[l2]);
 add("गण",GM[GA[g.nk]][GA[b.nk]],6,["देव","मनुष्य","राक्षस"][GA[g.nk]]+" / "+["देव","मनुष्य","राक्षस"][GA[b.nk]]);
 const dd=((b.rs-g.rs+12)%12)+1;
 add("भकूट",[2,12,5,9,6,8].includes(dd)?0:7,7,"");
 const nd=n=>[0,1,2,2,1,0][n%6];
 add("नाड़ी",nd(g.nk)==nd(b.nk)?0:8,8,["आदि","मध्य","अन्त्य"][nd(g.nk)]);
 return o}

// ---- render ----
const TABS=[["k","कुंडली"],["v","विंशोत्तरी"],["a","अष्टोत्तरी"],["s","षड्वर्ग"],["m","मिलान"]];
function rd(id){return {n:$(id+"n").value,d:$(id+"d").value,t:$(id+"t").value,lat:+$(id+"la").value,lon:+$(id+"lo").value,z:$(id+"z").value===""?null:+$(id+"z").value,tz:$(id+"p").dataset.tz||""}}
function show(k){document.querySelectorAll(".pane").forEach(p=>p.classList.toggle("on",p.id=="p"+k));
 document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on",b.dataset.k==k))}
function head(c){return `<p>${c.n}: चंद्र राशि <b>${R[c.rs]}</b>, नक्षत्र <b>${N[c.nk]}</b> (पाद ${Math.floor((c.moon%NW)/(NW/4))+1}), लग्न <b>${R[Math.floor(c.s.Lg/30)]}</b> · UTC${c.z>=0?"+":""}${c.z}</p>`}
sp("a");sp("b");
$("go").onclick=()=>{
 try{
  const A=calc(rd("a")),B=calc(rd("b")),b=A.utc.getTime();
  const rows=["Lg",...PL].map(k=>`<tr><td>${k=="Lg"?"लग्न":P[k]}</td><td>${R[Math.floor(A.s[k]/30)]}</td><td>${dm(A.s[k])}</td><td>${N[Math.floor(A.s[k]/NW)]}</td><td>${((Math.floor(A.s[k]/30)-Math.floor(A.s.Lg/30)+12)%12)+1}</td></tr>`).join("");
  const ms=milan(A,B),tot=ms.reduce((s,x)=>s+x[1],0);
  const pan={
   k:head(A)+`<p class="note">लाहिड़ी अयनांश: ${A.ay.toFixed(3)}° · राहु: मध्यम नोड</p>`+`<h2>उत्तर भारतीय</h2>`+nchart(A,1)+`<h2>दक्षिण भारतीय</h2>`+chart(A,1)+`<div class="w"><table><tr><th>ग्रह</th><th>राशि</th><th>अंश</th><th>नक्षत्र</th><th>भाव</th></tr>${rows}</table></div>`,
   v:head(A)+`<h2>विंशोत्तरी दशा (120 वर्ष)</h2>`+dtab(vim(A),b),
   a:head(A)+`<h2>अष्टोत्तरी दशा (108 वर्ष)</h2><p class="note">अभिजित के बिना 27 नक्षत्र गणना। लागू होने की शर्त (राहु केंद्र/त्रिकोण में लग्नेश से) अलग से जाँचें।</p>`+dtab(ash(A),b),
   s:head(A)+`<div class="w"><table><tr><th>ग्रह</th>${VV.map(v=>`<th>${VN[v]}</th>`).join("")}</tr>${["Lg",...PL].map(k=>`<tr><td>${k=="Lg"?"लग्न":P[k]}</td>${VV.map(v=>`<td>${R[vg(A.s[k],v)]}</td>`).join("")}</tr>`).join("")}</table></div>`+`<h2>नवांश (D9)</h2>`+nchart(A,9),
   m:`<p>${A.n} (${R[A.rs]}, ${N[A.nk]}) और ${B.n} (${R[B.rs]}, ${N[B.nk]})</p><div class="big">${tot} / 36</div><p class="note">${tot>=18?"18 से अधिक: सामान्यतः स्वीकार्य":"18 से कम: सामान्यतः अनुकूल नहीं माना जाता"}${ms[7][1]==0?" · नाड़ी दोष":""}${ms[6][1]==0?" · भकूट दोष":""}</p><div class="w"><table><tr><th>कूट</th><th>प्राप्त</th><th>पूर्णांक</th><th></th></tr>${ms.map(x=>`<tr><td>${x[0]}</td><td>${x[1]}</td><td>${x[2]}</td><td>${x[3]}</td></tr>`).join("")}</table></div>`
  };
  $("tabs").innerHTML=TABS.map(t=>`<button data-k="${t[0]}" onclick="show('${t[0]}')">${t[1]}</button>`).join("");
  $("out").innerHTML=TABS.map(t=>`<div class="pane" id="p${t[0]}">${pan[t[0]]}</div>`).join("");
  show("k");
 }catch(e){$("out").innerHTML=`<p>गणना नहीं हो सकी: ${e.message}. तिथि, समय और स्थान जाँचें।</p>`}
};
</script></body></html>
