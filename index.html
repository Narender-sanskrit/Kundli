function dasha(seq,i0,fr,tot,b){

  let u=s,ad=[];for(let j=0;j<seq.length;j++){const [p2,y2]=seq[(i+j)%seq.length],du=yr*y2/tot*Y;ad.push([p2,u,u+du]);u+=du}
  o.push({pl,s,e:t,ad})}

function dtab(D,b,seq,tot,nmf=k=>P[k]){const now=Date.now();
 const pr=(m,a)=>{let u=a[1],i=seq.findIndex(z=>z[0]==a[0]),du=a[2]-a[1],o="<tr><th>दशा</th><th>आरंभ</th><th>समाप्ति</th></tr>";

 return D.filter(x=>x.e>b).map(x=>`<details${now>=x.s&&now<x.e?" open":""}><summary><b>${nmf(x.pl)}</b> महादशा: ${fd(Math.max(x.s,b))} से ${fd(x.e)}${now>=x.s&&now<x.e?" (वर्तमान)":""}</summary>${x.ad.filter(a=>a[2]>b).map(a=>`<details style="margin-left:14px"><summary>${nmf(x.pl)}-${nmf(a[0])}: ${fd(Math.max(a[1],b))} से ${fd(a[2])}</summary><div class="w"><table>${pr(x.pl,a)}</table></div></details>`).join("")}</details>`).join("")}

function vg(x,v){const s=Math.floor(x/30),d=x%30,od=s%2==0,mf=s%3,k=n=>Math.floor(d/(30/n));
 if(v==1)return s;
 if(v==2)return (d<15)==od?4:3;
 if(v==3)return (s+4*k(3))%12;
 if(v==4)return (s+3*k(4))%12;
 if(v==7)return ((od?s:s+6)+k(7))%12;
 if(v==9)return ([s,s+8,s+4][mf]+k(9))%12;
 if(v==10)return ((od?s:s+8)+k(10))%12;
 if(v==12)return (s+k(12))%12;
 if(v==16)return ([0,4,8][mf]+k(16))%12;
 if(v==20)return ([0,8,4][mf]+k(20))%12;
 if(v==24)return ((od?4:3)+k(24))%12;
 if(v==27)return ([0,3,6,9][s%4]+k(27))%12;
 if(v==40)return ((od?0:6)+k(40))%12;
 if(v==45)return ([0,4,8][mf]+k(45))%12;
 if(v==60)return (s+k(60))%12;
 const L=od?[[5,0],[10,10],[18,8],[25,2],[30,6]]:[[5,1],[12,5],[20,11],[25,9],[30,7]];
 return L.find(l=>d<l[0])[1]}

const LPS=[[1,"सिद्धान्तमौपनिषदं शुद्धान्तं परमेष्ठिनः । शोणाधरं महः किञ्चिद् वीणाधरमुपास्महे ॥","मंगलाचरण: ग्रंथ के आरंभ की वंदना।"],[2,"वयं पाराशरीं होरामनुसृत्य यथामति । उडुदायप्रदीपाख्यं कुर्मो दैवविदां मुदे ॥","पराशर की होरा का अनुसरण कर, अपनी मति से, दैवज्ञों के आनंद के लिए 'उडुदायप्रदीप' नामक ग्रंथ की रचना।"],[3,"फलानि नक्षत्रदशाप्रकारेण विवृण्महे । दशा विंशोत्तरी चात्र ग्राह्या नाष्टोत्तरी मता ॥","इस ग्रंथ में फल नक्षत्र-दशा (विंशोत्तरी) से कहे जाते हैं; अष्टोत्तरी मान्य नहीं।"],[4,"बुधैर्भावादयः सर्वे ज्ञेयाः सामान्यशास्त्रतः । एतच्छास्त्रानुसारेण संज्ञां ब्रूमो विशेषतः ॥","भाव आदि सामान्य शास्त्र से जानें; इस शास्त्र की विशेष संज्ञाएँ आगे कही जाती हैं।"],[5,"पश्यन्ति सप्तमं सर्वे शनिजीवकुजाः पुनः । विशेषतश्च त्रिदशत्रिकोणचतुरष्टमान् ॥","सब ग्रह सप्तम को देखते हैं; शनि 3 और 10, गुरु 5 और 9, मंगल 4 और 8 को विशेष रूप से देखते हैं।"],[6,"सर्वे त्रिकोणनेतारो ग्रहाः शुभफलप्रदाः । पतयस्त्रिषडायानां यदि पापफलप्रदाः ॥","त्रिकोण (1, 5, 9) के स्वामी शुभ फल देते हैं; त्रिषडाय (3, 6, 11) के स्वामी पाप फल देते हैं।"],[7,"न दिशन्ति शुभं नृणां सौम्याः केन्द्राधिपाः यदि । क्रूराश्चेदशुभं ह्येते प्रबलाश्चोत्तरोत्तरम् ॥","सौम्य ग्रह केंद्राधिपति होकर शुभ फल नहीं देते; क्रूर ग्रह केंद्राधिपति होकर अशुभ फल नहीं देते; ये क्रमशः उत्तरोत्तर बलवान हैं।"],[8,"लग्नाद् व्ययद्वितीयेशौ परेषां साहचर्यतः । स्थानान्तरानुगुण्येन भवतः फलदायकौ ॥","लग्न से द्वादशेश और द्वितीयेश अन्य ग्रहों के साहचर्य और अपने दूसरे स्थान के अनुसार फल देते हैं।"],[9,"भाग्यव्ययाधिपत्येन रन्ध्रेशो न शुभप्रदः । स एव शुभसन्धाता लग्नाधीशोऽपि चेत् स्वयम् ॥","अष्टमेश शुभ नहीं होता; वही लग्नेश भी हो तो शुभ है।"],[10,"केन्द्राधिपत्यदोषस्तु बलवान् गुरुशुक्रयोः । मारकत्वेऽपि च तयोर्मारकस्थानसंस्थितिः ॥","केंद्राधिपत्य दोष गुरु और शुक्र में बलवान है; मारक स्थान में स्थित या मारकेश होने पर वे बलवान मारक बनते हैं।"],[11,"बुधस्तदनु चन्द्रोऽपि भवेत् तदनु तद्विधः । न रन्ध्रेशत्वदोषस्तु सूर्याचन्द्रमसोर्भवेत् ॥","केंद्राधिपत्य दोष शुक्र से कम बुध में और उससे कम चंद्र में है; सूर्य-चंद्र को अष्टमेश होने का दोष नहीं।"],[12,"कुजस्य च यत् । तयोरपि व्ययस्थानं मारकस्थानमुच्यते ॥","अष्टम आयु का स्थान, उससे अष्टम (तृतीय) भी; इन दोनों के व्यय-स्थान (द्वितीय, सप्तम) मारक स्थान कहे जाते हैं।"],[24,"तत्राप्याद्यव्ययस्थानादुत्तरं बलवत्तरम् । तदीशितुस्तत्रगताः पापिनस्तेन संयुताः ॥","दोनों मारक स्थानों में द्वितीय सप्तम से अधिक बलवान मारक है; उनके स्वामी, उनमें स्थित और उनसे युत पापी ग्रह मारक।"],[25,"तेषां दशाविपाकेषु संभवे निधनं नृणाम् । तेषामसम्भवे साक्षाद् व्ययाधीशदशास्वपि ॥","इनकी दशाओं में मृत्यु संभव; न हो तो व्ययेश (द्वादशेश) की दशा में।"],[26,"अलाभे पुनरेतेषां सम्बन्धेन व्ययेशितुः । क्वचिच्छुभानां च दशास्वष्टमेशदशासु च ॥","इनके अभाव में व्ययेश से संबंधी ग्रहों की, कहीं शुभ ग्रहों की और अष्टमेश की दशाओं में।"],[27,"केवलानां च पापानां दशासु निधनं क्वचित् । कल्पनीयं बुधैर्नृणां मारकाणामदर्शने ॥","मारकों के न दिखने पर केवल पापी ग्रहों की दशा में मृत्यु की कल्पना की जाए।"],[28,"मारकैः सह सम्बन्धान्निहन्ता पापकृच्छनिः । अतिक्रम्येतरान् सर्वान् भवत्येव न संशयः ॥","मारकों से संबंध करने वाला पापी शनि अन्य सबको लाँघकर निश्चित मारक होता है।"],[29,"न दिशेयुर्ग्रहाः सर्वे स्वदशासु स्वभुक्तिषु । शुभाशुभफलं नृणामात्मभावानुरूपतः ॥","सब ग्रह अपनी दशा और अपनी ही भुक्ति में शुभाशुभ फल नहीं देते (वे अपने भाव के अनुरूप फल देते हैं)।"],[30,"आत्मसम्बन्धिनो ये च ये वा निजसधर्मिणः । तेषामन्तर्दशास्वेव दिशन्ति स्वदशाफलम् ॥","आत्मसंबंधी या सधर्मी ग्रहों की अंतर्दशा में दशानाथ अपनी ही दशा का फल देता है।"],[31,"इतरेषां दशानाथविरुद्धफलदायिनाम् । तत्तत्फलानुगुण्येन फलान्यूह्यानि सूरिभिः ॥","दशानाथ से असंबंधी और विरुद्ध फल देने वाले ग्रहों की अंतर्दशा में दोनों के फलों के अनुसार विद्वान् फल की कल्पना करें।"],[32,"स्वदशायां त्रिकोणेशः भुक्तौ केन्द्रपतिः शुभम् । दिशेत् सोऽपि तथा नोचेदसम्बन्धेन पापकृत् ॥","केंद्रेश अपनी दशा में संबंधी त्रिकोणेश की भुक्ति में शुभ फल देता है; त्रिकोणेश भी वैसे ही; संबंध न हो तो दोनों पाप फल देते हैं।"],[33,"आरम्भो राजयोगस्य भवेन्मारकभुक्तिषु । प्रथयन्ति तमारभ्य क्रमशः पापभुक्तिषु ॥","राजयोग का आरंभ मारक भुक्तियों में होता है और आगे क्रमशः पाप भुक्तियों में बढ़ता है (अनुवादक: प्रसिद्धि मिलती है, पूर् function lpsec(c){const L=lpcls(c),Y=lpyg(c),td=x=>`<td style="white-space:normal;text-align:left">${x}</td>`,P7=["Su","Mo","Ma","Me","Ju","Ve","Sa"],
 pl=P7.map(k=>`<tr><td>${P[k]}</td><td>${L[k].hs.join(", ")||"—"}</td>${td(L[k].nat||"—")}${td((L[k].mk?L[k].mk+(L[k].strongMk?"; बलवान मारक (सू. 10)":"")+"; ":"")+(L[k].ct?"सू. "+L[k].ct:""))}</tr>`).join(""),
 yr=Y.length?Y.map(y=>`<tr><td>${P[y.a]} (भाव ${y.kh}) + ${P[y.b]} (भाव ${y.th})</td><td>${y.r}</td>${td(y.lab)}</tr>`).join(""):'<tr><td colspan="3">केंद्रेश-त्रिकोणेश का कोई संबंध नहीं मिला।</td></tr>',
 ds=lpds(c,L).map(x=>`<tr><td>${x[0]}</td>${td(x[1])}</tr>`).join(""),sl=LPS.map(x=>`<tr><td>${x[0]}</td><td>${x[0]<=5?"संज्ञा":x[0]<=13?"फलनिर्णय":x[0]<=22?"योगफल":x[0]<=28?"मारक":"दशाफल"}</td><td class="nt" style="white-space:normal;text-align:left">${x[1]}</td>${td(x[2])}</tr>`).join(""),
 mkr=P7.filter(k=>L[k].mk),sat=mkr.filter(k=>k!="Sa"&&lprel(c,"Sa",k)),mk2=mkr.length?`<h2>मारक विचार (सू. 23-28)</h2><table><tr><td>मारकेश</td>${td(mkr.map(k=>P[k]+" ("+L[k].mk+")").join("; "))}</tr>${sat.length?`<tr><td>शनि का संबंध</td>${td("शनि का मारकेश "+sat.map(k=>P[k]).join(", ")+" से संबंध है: शनि सबसे प्रबल मारक (सू. 28)।")}</tr>`:""}</table>`:"";
 return `<h2>लघुपाराशरी विश्लेषण: सार</h2>${lpsum(c,L,Y)}<h2>लघुपाराशरी के अनुसार ग्रहों की प्रकृति</h2><div class="w"><table><tr><th>ग्रह</th><th>भाव (स्वामित्व)</th><th>प्रकृति</th><th>आधार</th></tr>${pl}</table></div><h2>ग्रह-वार विश्लेषण</h2><table><tr><th>ग्रह</th><th>विश्लेषण</th></tr>${lpvis(c,L)}</table><h2>केंद्र-त्रिकोण संबंध (राजयोग)</h2><table><tr><th>ग्रह</th><th>संबंध</th><th>फल</th></tr>${yr}</table>${mk2}<h2>वर्तमान दशा (लघुपाराशरी के सूत्र)</h2><table>${ds}</table><h2>दशा-फल का विश्लेषण (अगली 3 महादशाएँ)</h2>${lpdt(c,L)}<details><summary>मूल श्लोक और भावार्थ (सूत्र 1–42)</summary><div class="w"><table><tr><th>सू.</th><th>अध्याय</th><th>श्लोक</th><th>भावार्थ</th></tr>${sl}</table></div><p class="note">श्लोक 1–42: आपके दिए पाठ (लघुपाराशरी) से। पाँच स्पष्ट टंकण-सुधार किए: सू. 4 "ज्ञेया" → "ज्ञेयाः", सू. 14 "विषेश" → "विशेष", सू. 22 "समान्धमात्रेण" → "सम्बन्धमात्रेण", सू. 31 "जलान्यूह्यानि" → "फलान्यूह्यानि", सू. 39 "मारक्ः" → "मारकः"। हिंदी अनुवाद ज्योतिषी सिद्धार्थ के लेख से मिलाकर अपने शब्दों में सार।</p></details>`}
const BPH=[["लग्नेशे लग्नगे देहसुखभाग् भुजविक्रमी । मनस्वी चञ्चलश्चैव द्विभार्यो परगोऽपि व ॥","देह-सुख, पराक्रमी, मनस्वी पर चंचल; दो पत्नियाँ या परस्त्री-संग संभव।"],["लग्नेशे धनगे बालो लाभवान् पण्डितः सुखी । सुशीलो धर्मविन्मानी बहुदारगुणैर्युतः ॥","लाभवान, विद्वान, सुखी, सुशील, धर्मज्ञ, मानी; अनेक पत्नी-गुण।"],["लग्नेशे सहजे जातः सिंहतुल्यपराक्रमी । सर्वसम्पद्युतो मानी द्विभार्यो मतिमान् सुखी ॥","सिंह-तुल्य पराक्रमी, सर्वसंपदा-युक्त, मानी, दो पत्नियाँ, बुद्धिमान, सुखी।"],["लग्नेशे सुखगे बालः पितृमातृसुखान्वितः । बहुभ्रातृयुतः कामी गुणरूपसमन्वितः ॥","माता-पिता का सुख, अनेक भाई, कामी, गुण-रूप से युक्त।"],["लग्नेशे सुतगे जन्तोः सुतसौख्यं च मध्यमम् । प्रथमापत्यनाशः स्यान्मानी क्रोधी नृपप्रियः ॥","संतान-सुख मध्यम, प्रथम संतान की हानि; मानी, क्रोधी, राजप्रिय।"],["लग्नेशे षष्ठगे जातो देहसौख्यविवर्जितः । पापाढ्ये शत्रुतः पीडा सौम्यदृष्टिविवर्जिते ॥","देह-सुख से वंचित; पापग्रह-युत और सौम्य-दृष्टि-रहित हो तो शत्रु से पीड़ा।"],["लग्नेशे सप्तमे पापे भार्या तस्य न जीवति । शुभेऽटनो दरिद्रो वा विरक्तो वा नृपोऽपि वा ॥","पापी हो तो पत्नी नहीं जीती; शुभ हो तो भटकने वाला, दरिद्र, विरक्त या राजा।"],["लग्नेशेऽष्टमगे जातः सिद्धविद्याविशारदः । रोगी चौरो महाक्रोधी द्यूती च परदारगः ॥","सिद्ध-विद्या में निपुण; रोगी, चोर-प्रवृत्ति, महाक्रोधी, जुआरी, परस्त्रीगामी।"],["लग्नेशे भाग्यगे जातो भाग्यवाञ्जनवल्लभः । विष्णुभक्तः पटुर्वाग्मी दारपुत्रधनैर्युतः ॥","भाग्यवान, जनप्रिय, विष्णुभक्त, चतुर, वाग्मी; स्त्री-पुत्र-धन से युक्त।"],["लग्नेशे दशमे जातः पितृसौख्यसमन्वितः । नृपमान्यो जने ख्यातः स्वार्जितस्वो न संशयः ॥","पितृ-सुख, राजमान्य, लोक में प्रसिद्ध, स्वयं अर्जित धन।"],["लग्नेशे लाभगे जातः सदा लाभसमन्वितः । सुशीलः ख्यातकीर्तिश्च बहुदारगुणैर्युतः ॥","सदा लाभ, सुशील, प्रसिद्ध कीर्ति; अनेक पत्नी-गुण।"],["लग्नेशे व्ययभावस्थे देहसौख्यविवर्जितः । व्यर्थव्ययी महाक्रोधी शुभदृग्योगवर्जिते ॥","शुभ दृष्टि/योग न हो तो देह-सुख से वंचित, व्यर्थ व्यय, महाक्रोधी।"],
["धनेशे लग्नगे जातः पुत्रवान् धनसंयुतः । कुटुम्बकण्टकः कामी निष्ठुरः परकार्यकृत् ॥","पुत्रवान, धनी; कुटुंब के लिए कंटक, कामी, निष्ठुर, परकार्य-कर्ता।"],["धनेशे धनगे जातो धनवान् गर्वसंयुतः । द्विभार्यो बहुभार्यो वा सुतहीनः प्रजायते ॥","धनवान, गर्वी; दो या बहुत पत्नियाँ, या पुत्रहीन।"],["धनेशे सहजे जातो विक्रमी मतिमान् गुणी । कामी लोभी शुभाढ्ये च पापाढ्ये देवनिन्दकः ॥","पराक्रमी, बुद्धिमान, गुणी, कामी, लोभी; पापयुत हो तो देव-निंदक।"],["धनेशे सुखभावस्थे सर्वसम्पतसमन्वितः । गुरुणा संयुते स्वोच्चे राजतुल्यो नरो भवेत् ॥","सर्व-संपदा; गुरु-युत और उच्च का हो तो राजा के तुल्य।"],["धनेशे सुतभावस्थे जातो धनसमन्वितः । धनोपार्जनशीलाश्च जायन्ते तत्सुता अपि ॥","धनवान; उसकी संतान भी धन कमाने वाली।"],["धनेशे रिपुभावस्थे सशुभे शत्रुतो धनम् । सपापे शत्रुतो हानिर्जंघावैकल्यवान् भवेत् ॥","शुभयुत हो तो शत्रु से धन; पापयुत हो तो शत्रु से हानि और जंघा-दोष।"],["धनेशे सप्तमे जातः परदाररतो भिषेक् । पापेक्षितयुते तस्य भार्या च व्यभिचारिणी ॥","परस्त्री-रत, वैद्य; पाप-युत/दृष्ट हो तो पत्नी व्यभिचारिणी।"],["धनेशेऽष्टमगे जातो भूरिभूमिधनैर्युतः । पत्नीसुखं भवेत् स्वल्पं ज्येष्ठभ्रातृसुखं न हि ॥","बहुत भूमि-धन; पत्नी-सुख अल्प, ज्येष्ठ भ्राता का सुख नहीं।"],["धनेशे धर्मभावस्थे धनवानुद्यमी पटुः । बाल्ये रोगी सुखी पश्चात् तीर्थधर्मव्रतादिकृत् ॥","धनवान, उद्यमी, कुशल; बचपन में रोगी, बाद में सुखी; तीर्थ-धर्म-व्रत करने वाला।"],["धनेशे कर्मगे जातः कामी मानी च पण्डितः । बहुदार्यधनैर्युक्तः किञ्च पुत्रसुखोज्झितः ॥","कामी, मानी, पंडित; अनेक स्त्री-धन, पर पुत्र-सुख से वंचित।"],["धनेशे लाभभावस्थे सर्वलाभसमन्वितः । सदोद्योगयुतो मानी कीर्तिमान् जायते नरः ॥","सर्व-लाभ, सदा उद्यमी, मानी, कीर्तिमान।"],["धनेशे व्ययभावस्थे साहमी धनवर्जितः । परभाग्यरतस्तस्य ज्येष्ठापत्यसुखं नहि ॥","साहसी पर निर्धन; दूसरों के भाग्य पर आश्रित; ज्येष्ठ संतान का सुख नहीं।"],
["लग्नगे सहजाधीशे स्वभुजार्जितवित्तवान् । सेवाज्ञः साहसी जातो विद्याहीनोऽपि बुद्धिमान् ॥","स्वभुजार्जित धन, सेवा-ज्ञ, साहसी; विद्या-हीन पर बुद्धिमान।"],["द्वितीये सहजाधीशे स्थूलो विक्रमवर्जितः । स्वल्पारम्भी सुखी न स्यात् परस्त्रीधनकामुकः ॥","स्थूल, पराक्रम-रहित, अल्प-आरंभी, सुखी नहीं; परस्त्री-धन का कामी।"],["सहजे सहजाधीशे सहोदरसुखान्वितः । धनपुत्रयुतो हृष्टो भुनक्ति सुखमद्भुतम् ॥","भाई-बहनों का सुख, धन-पुत्र, प्रसन्न; अद्भुत सुख भोगने वाला।"],["सुखस्थे सहजाधीशे सुखी च धनसंयुतः । मतिमान् जायते बालो दुष्टभार्यापतिश्च सः ॥","सुखी, धनी, बुद्धिमान; पर दुष्ट पत्नी का पति।"],["सुतस्थे सहजाधीशे पुत्रवान् गुणसंयुतः । भार्या तस्य भवेत् क्रूरा क्रूरग्रहयुतेक्षिते ॥","पुत्रवान, गुणी; क्रूर ग्रह से युत/दृष्ट हो तो पत्नी क्रूर।"],["षष्ठभावे तृतीयेशे भ्रातृशत्रुर्महाधनी । मातुलैश्च समं वैरं मातुलानीप्रियो नरः ॥","भाइयों का शत्रु, महाधनी; मामाओं से वैर, मामी का प्रिय।"],["सप्तमे सहजाधीशे राजसेवापरो नरः । बाल्ये दुःखी सुखी चान्ते जायते नाऽत्र संशयः ॥","राजसेवा-परायण; बचपन में दुखी, अंत में सुखी।"],["अष्टमे सहजाधीशे जातश्चैरो नरो भवेत् । दासवृत्त्योपजीवी च राजद्वारे मृतिर्भवेत् ॥","चोर-प्रवृत्ति, दास-वृत्ति से जीविका; राजद्वार (दंड) से मृत्यु का भय।"],["नवमे सहजाधीशे पितुः सुखविवर्जितः । स्त्रीभिर्भाग्योदयस्तस्य पुत्रादिसुखसंयुतः ॥","पिता का सुख नहीं; स्त्रियों से भाग्योदय; पुत्रादि-सुख।"],["दशमे सहजाधीशे जातः सर्वसुखान्वितः । स्वभुजार्जिवित्तश्च दुष्टस्त्रीभरणे रतः ॥","सर्वसुखी, स्वयं अर्जित धन; दुष्ट स्त्री का पालन करने वाला।"],["लाभगे सहजाधीशे व्यापारे लाभवान् सदा । विद्याहीनोऽपि मेधावी साहसी परसेवकः ॥","व्यापार में सदा लाभ; विद्या-हीन पर मेधावी, साहसी, परसेवक।"],["व्ययस्थे सहजाधीशे कुतार्ये व्ययकृज्जनः । पिता तस्य भवेत् क्रूरः स्त्रीभिर्भाग्योदयस्तथा ॥","कुकार्यों में व्यय; पिता क्रूर; स्त्रियों से भाग्योदय।"],
["सुखेशे लग्नगे जातो विद्यागुणविभूषितः । भूमीवाहनसंयुक्तो मातुः सुखसमन्वितः ॥","विद्या-गुण से विभूषित, भूमि-वाहन-युक्त, माता का सुख। (स्रोत-पाठ में 'धनगे' है; यहाँ लग्न मानकर रखा, क्योंकि अगला श्लोक द्वितीय का है)"],["सुखेशे धनगे जातो भोगी सर्वधनान्वितः । कुटुम्बसहितो मानी साहसी कुहकान्वितः ॥","भोगी, सर्वधन-युक्त, कुटुंब-सहित, मानी, साहसी, कुहक (चतुर/छली)।"],["सुखेशे सहजे जातो विक्रमी भृत्यसंयुतः । उदारोऽरुग् गुणी दाता स्वभुजार्जितवित्तवान् ॥","पराक्रमी, सेवक-युक्त, उदार, निरोग, गुणी, दाता, स्वभुजार्जित धन।"],["सुखेशे सुखभावस्थे मन्त्री सर्वधनान्वितः । चतुरः शीलवान् मानी ज्ञानवान् स्त्रीप्रियः सुखी ॥","मंत्री-समान, सर्वधन-युक्त, चतुर, शीलवान, मानी, ज्ञानी, स्त्रीप्रिय, सुखी।"],["सुखेशे पुत्रभावस्थे सुखी सर्वजनप्रियः । विष्णुभक्तो गुणी मानी स्वभुजार्जितवित्तवान् ॥","सुखी, सर्वजनप्रिय, विष्णुभक्त, गुणी, मानी, स्वभुजार्जित धन।"],["सुखेशे रिपुभावस्थे मातुः सुखविवर्जितः । क्रोधी चोरोऽभिचारी च स्वेच्छाचारश्च दुर्मनाः ॥","माता के सुख से वंचित; क्रोधी, चोर, अभिचारी, स्वेच्छाचारी, दुर्मना।"],["सुखेशे सप्तमे जातो बहुविद्यासमन्वितः । पित्रार्जितधनत्यागी सभायां मूकवद् भवेत् ॥","बहुविद्या-युक्त; पिता का धन त्यागने वाला; सभा में मूक-सा।"],["सुखेशे रन्ध्रभावस्थे गृहादिसुखवर्जितः । पित्रोः सुखं भवेदल्पं जातः क्लीबसमो भवेत् ॥","गृहादि-सुख से वंचित; माता-पिता का सुख अल्प; नपुंसक-तुल्य।"],["सुखेशे भाग्यभावस्थे जातः सर्वजनप्रियः । देवभक्तो गुणी मानी भवेत् सर्वसुखान्वितः ॥","सर्वजनप्रिय, देवभक्त, गुणी, मानी, सर्वसुखी।"],["सुखेशे कर्मभावस्थे राजमान्यो नरो भवेत् । रसायनी महाहृष्टो सुखभोगी जितेन्द्रियः ॥","राजमान्य, रसायनी, प्रसन्न, सुखभोगी, जितेंद्रिय।"],["सुखेशे लाभगे जातो गुप्तरोगभयान्वितः । उदारी गुणवान् दाता परोपकरणे रतः ॥","गुप्त-रोग का भय; उदार, गुणी, दाता, परोपकारी।"],["सुखेशे व्ययभावस्थे गृहादिसुखवर्जितः । जातो दुर्व्यसनी मूढः सदाऽलस्यसमन्वितः ॥","गृहादि-सुख से वंचित; दुर्व्यसनी, मूढ़, आलसी।"],
["सुतेशे लग्नगे जातो विद्यान् पुत्रसुखान्वितः । कदर्यो वक्रचित्तश्च परद्रव्यापहारकः ॥","विद्वान, पुत्र-सुख; कंजूस, कुटिल-चित्त, परद्रव्य-हारी।"],["सुतेशे धनगे जातो बहुपुत्रो धनान्वितः । कुटुम्बपोषको मानी स्त्रीप्रियः सुयशा भुवि ॥","बहुपुत्र, धनी, कुटुंब-पोषक, मानी, स्त्रीप्रिय, यशस्वी।"],["सुतेशे सहजे भावे जायते सोदरप्रियः । पिशुनश्च कदर्यश्च स्वकार्यनिरतः सदा ॥","भाई-प्रिय; पिशुन, कंजूस, सदा अपने कार्य में रत।"],["सुतेशे सुखभावस्थे सुखी मातृसुखान्वितः । लक्ष्मीयुक्तः सुबुद्धिश्च राज्ञोऽमात्योऽथवा गुरुः ॥","सुखी, माता का सुख, लक्ष्मीयुक्त, सुबुद्धि; राजा का अमात्य या गुरु।"],["सुतेशे सुतभावस्ते शुभाढ्ये पुत्रवान् नरः । पापाढ्येऽपत्यहीनोऽसौ गुणवान् मित्रवत्सलः ॥","शुभ-युत हो तो पुत्रवान; पाप-युत हो तो अपत्यहीन; गुणी, मित्रवत्सल।"],["सुतेशे रिपुभावस्थे पुत्रः शत्रुसमो भवेत् । मृतापत्योऽथवा जातो दत्तक्रीतसुतोऽथवा ॥","पुत्र शत्रु-तुल्य; मृतापत्य, या दत्तक/क्रीत पुत्र।"],["सुतेशे सप्तमे मानी सर्वधर्मसमन्वितः । पुत्रादिसुखयुक्तश्च परोपकरणे रतः ॥","मानी, सर्वधर्म-युक्त, पुत्रादि-सुख, परोपकारी।"],["सुतेशे रन्ध्रभावस्थे स्वल्पपुत्रसुखान्वितः । कासश्वाससमायुक्तः क्रोधी च सुखवर्जितः ॥","पुत्र-सुख अल्प; खाँसी-श्वास रोग, क्रोधी, सुख-हीन।"],["सुतेशे भाग्यगे पुत्रो भपो वा तत्समो भवेत् । स्वयं वा ग्रन्थकर्ता च विख्यातः कुलदीपकः ॥","पुत्र राजा या उसके तुल्य; या स्वयं ग्रंथकर्ता, विख्यात, कुलदीपक।"],["सुतेशे राज्यभावस्थे राजयोगो हि जायते । अनेकसुखभोगी च ख्यातकीर्तिर्नरो भवेत् ॥","राजयोग; अनेक सुखों का भोगी, ख्यातकीर्ति।"],["सुतेशे लाभगे जातो विद्यावान् जनवल्लभः । ग्रन्थकर्ता महादक्षो बहुपुत्रधनान्वितः ॥","विद्यावान, जनप्रिय, ग्रंथकर्ता, महादक्ष, बहुपुत्र-धन।"],["सुतेशे व्ययभावस्थे जातः पुत्रसुखोज्ज्ञितः । दत्तपुत्रयुतो वाऽसौ क्रीतपुत्रान्वितोऽथवा ॥","पुत्र-सुख से वंचित; दत्तक या क्रीत पुत्र।"],
["षष्ठेशे लग्नगे जातो रोगवान् कीर्तिसंयुतः । आत्मशत्रुर्धनी मानी साहसी गुणवान् नरः ॥","रोगी पर कीर्तिमान; आत्मशत्रु, धनी, मानी, साहसी, गुणवान।"],["षष्ठेशे धनभावस्थे साहसी कुलविश्रुतः । परदेशी सुखी वक्ता स्वकर्मनीरतः सदा ॥","साहसी, कुल में प्रसिद्ध, परदेशी, सुखी, वक्ता, अपने कर्म में रत।"],["षष्ठेशे सहजः जातः क्रोधी विक्रमवर्जितः । भ्राता शत्रुसमस्तस्य भृत्यश्चोत्तरदायकः ॥","क्रोधी, पराक्रम-रहित; भाई शत्रु-तुल्य; सेवक उत्तर देने वाले (अवज्ञाकारी)।"],["षष्ठेशे सुखभावस्थे मातुः सुखविवर्जितः । मनस्वी पिशुना द्वेषी चलचित्तोऽतिवित्तवान् ॥","माता के सुख से वंचित; मनस्वी, पिशुन, द्वेषी, चलचित्त, अति धनी।"],["षष्ठेशे सुतगो यस्य चलं तस्य धनादिकम् । शत्रुता पुत्रमित्रैश्च सुखी स्वार्थी दयान्वितः ॥","धन अस्थिर; पुत्र-मित्रों से शत्रुता; सुखी, स्वार्थी, दयालु।"],["षष्ठेशे रिपुभावस्थे वैरं स्वज्ञातिमण्डलात् । अन्यैः सह भवेन् मैत्री सुखं मध्यं धनादिजम् ॥","अपने जाति-समूह से वैर; दूसरों से मैत्री; सुख-धन मध्यम।"],["षष्ठेशे दारभावस्थे जातो दारसुखोज्झितः । कीर्तिमान् गुणवान् मानी साहसी धनसंयुतः ॥","दारा-सुख से वंचित; कीर्तिमान, गुणी, मानी, साहसी, धनी।"],["षष्ठेशेऽष्टमगे जातो रोगी शत्रुर्मनीषिणाम् । परद्रव्याभिलाषी च परदाररतोऽशुचिः ॥","रोगी, विद्वानों का शत्रु, परद्रव्य-लोभी, परस्त्रीगामी, अशुचि।"],["षष्ठेशे भाग्यगे जातः काष्ठपाषाणविक्रयी । व्यवहारे क्वचिद्धानिः क्वचिद्वृद्धिश्च जायते ॥","काष्ठ-पाषाण बेचने वाला; व्यवहार में कभी हानि, कभी वृद्धि।"],["षष्ठेशे दशमे भावे मानवः कुलविश्रुतः । अभक्तश्च पितुर्वक्ता विदेशे च सुखी भवेत् ॥","कुल में प्रसिद्ध; पिता का अभक्त/निंदक; विदेश में सुखी।"],["षष्ठेशे लाभगे जातः शत्रुतो धनमाप्नुयात् । गुणवान् साहसी मानी किन्तु पुत्रसुखोज्झितः ॥","शत्रु से धन; गुणी, साहसी, मानी; पर पुत्र-सुख से वंचित।"],["षष्ठेशे व्ययभावस्थे व्यसने व्ययकृत् सदा । विद्वद्द्वेषी भवेज्जातो जीवहिंसासु तत्परः ॥","व्यसन में सदा व्यय; विद्वानों का द्वेषी; जीव-हिंसा में तत्पर।"],
["दारेशे लग्नगे जातः परदारेषु लम्पटः । दुष्टो विचक्षणोऽधीरो जनो वातरुजान्वितः ॥","परस्त्री-लंपट, दुष्ट पर चतुर, अधीर; वात-रोग से युक्त।"],["दारेशे धनगे जातो बहुस्त्रीभिः समन्वितः । दारयोगाद्धनाप्तिश्च दीर्घसूत्री च मानवः ॥","अनेक स्त्रियों से युक्त; पत्नी के योग से धन; दीर्घसूत्री।"],["दारेशे सहजे जातो मृतापत्यो हि मानवः । कदाचिज्जायते पुत्री यत्नात् पुत्रोऽपि जीवति ॥","संतान-हानि; कभी पुत्री; प्रयत्न से पुत्र जीवित रहता है।"],["दारेशे सुखभावस्थे जाया नास्य वशे सदा । स्वयं सत्यप्रियो धीमान् धर्मात्मा दन्तरोगयुक् ॥","पत्नी सदा वश में नहीं; स्वयं सत्यप्रिय, बुद्धिमान, धर्मात्मा; दंत-रोग।"],["दारेशे पञ्चमे जातो मानि सर्वगुणान्वितः । सर्वदा हर्षयुक्तश्च तथा सर्वधनाधिपः ॥","मानी, सर्वगुण-युक्त, सदा प्रसन्न, सर्वधन का स्वामी।"],["दारेशे रिपुभावस्थे भार्या तस्य रुजान्विता । स्त्रिया सहाऽथ वा वैरं स्वयं क्रोधी सुखोज्झितः ॥","पत्नी रोगिणी; या स्त्री से वैर; स्वयं क्रोधी, सुख-हीन।"],["दारेशे सप्तमे भावे जातो दारसुखान्वितः । धीरो विचक्षणो धीमान् केवलं वातरोगवान् ॥","दारा-सुख; धीर, चतुर, बुद्धिमान; केवल वात-रोग।"],["दारेशे मृत्युभावस्थे जातो दारसुखोज्झितः । भार्याऽपि रोगयुक्ताऽस्य दुःशीलाऽपि न चानुगा ॥","दारा-सुख से वंचित; पत्नी रोगी, दुःशील और अनुगामिनी नहीं।"],["दारेशे धर्मभावस्थे नानास्त्रीभिः समागमः । जायाहृतमना जातो बह्वारम्भकरो नरः ॥","अनेक स्त्रियों से संबंध; पत्नी में मन; बहुत आरंभ करने वाला।"],["दारेशे कर्मभावस्थे नास्य जाया वशानुगा । स्वयं धर्मरतो जातो धनपुत्रादिसंयुतः ॥","पत्नी वश में नहीं; स्वयं धर्मरत, धन-पुत्रादि से युक्त।"],["दारेशे लाभभावस्थे दारैरर्थसमागमः । पुत्रादिसुखमल्पं च जनः कन्यप्रजो भवेत् ॥","पत्नी से धन-लाभ; पुत्रादि-सुख अल्प; कन्याएँ अधिक।"],["दारेशे व्ययगे जातो दरिद्रः कृपणोऽपि वा । भार्या;पि व्ययशीलाऽस्य वस्त्राजीवी नरो भवेत् ॥","दरिद्र या कृपण; पत्नी भी खर्चीली; वस्त्र से जीविका।"],
["अष्टमेशे तनौ जातस्तनुसौख्यविवर्जितः । देवानां ब्राह्मणानां च निन्दको व्रणसंयुतः ॥","तन-सुख से वंचित; देव-ब्राह्मण का निंदक; व्रण-युक्त।"],["अष्टमेशे धने बाहुबलहीनः प्रजायते । धनं तस्य भवेत् स्वल्पं नष्ट वित्तं न लभ्यते ॥","बाहुबल-हीन; धन अल्प; खोया धन नहीं मिलता।"],["रन्ध्रेशे सहजे भावे भ्रातृसौख्यं न जायते । सालस्यो भृत्यहीनश्च जायते बलवर्जितः ॥","भाई-सुख नहीं; आलसी, सेवक-हीन, बल-हीन।"],["रन्ध्रेशे सुखभावस्थे मातृहीनो भवेच्छिशुः । गृहभूमिसुखैर्हीनो मित्रद्रोही न संशयः ॥","बाल्यावस्था में माता से हीन; गृह-भूमि-सुख-हीन; मित्रद्रोही।"],["रन्ध्रेशे सुतभावस्थे जडबुद्धिः प्रजायते । स्वल्पप्रज्ञो भवेज्जतो दीर्घायुश्च धनान्वितः ॥","जड़-बुद्धि, अल्प-प्रज्ञ; पर दीर्घायु और धनी।"],["रन्ध्रेशे रिपुभावस्थे शत्रुजेता भवेज्जनः । रोगयुक्तशरीरश्च बाल्ये सर्पजलाद् भयम् ॥","शत्रुजेता; रोगी शरीर; बचपन में सर्प-जल से भय।"],["रन्ध्रेशे दारभावस्थे तस्य भार्याद्वयं भवेत् । व्यापारे च भवेधानिस्तस्मिन् पापयुते ध्रुवम् ॥","दो पत्नियाँ; पाप-युत हो तो व्यापार में निश्चित हानि।"],["रन्ध्रेशे मृत्युभावस्थे जाता दीर्घायुषा युतः । निर्बले मध्यमायुः स्याच्चौरो निन्द्योऽन्यनिन्दकः ॥","दीर्घायु; निर्बल हो तो मध्यम आयु, चोर, निंदनीय, परनिंदक।"],["अष्टमेशे तपःस्थाने धर्मद्रोही च नास्तिकः । दुष्टभार्यापतिश्चैव परद्रव्यापहारकः ॥","धर्मद्रोही, नास्तिक; दुष्ट पत्नी का पति; परद्रव्य-हारी।"],["रन्ध्रेशे कर्मभावस्ते पितृसौख्यविवर्जितः । पिशुनः कर्महीनश्च यदि नैव शुभेक्षिते ॥","शुभ दृष्टि न हो तो पिता का सुख नहीं; पिशुन, कर्महीन।"],["रन्ध्रेशे लाभभावस्थे सपापे धनवर्जितः । बाल्ये दुःखी सुखी पश्चात् दीर्घायुश्च शुभान्विते ॥","पाप-युत हो तो निर्धन; बचपन में दुखी, बाद में सुखी; शुभ-युत हो तो दीर्घायु।"],["रन्ध्रेशे व्ययभावस्थे कुकार्ये व्ययकृत् सदा । अल्पायुश्च भवेज्जातः सपापे च विशेषतः ॥","कुकार्यों में सदा व्यय; अल्पायु, पाप-युत हो तो विशेष।"],
["भाग्येशे लग्नगे जातो भाग्यवान् भूपवन्दितः । सुशीलश्च सुरूपश्च विद्यावान् जनपूजितः ॥","भाग्यवान, राजवंदित, सुशील, सुरूप, विद्यावान, जनपूजित।"],["भाग्येशे धनभावस्थे पण्डितो जनवल्लभः । जायते धनवान् कामी स्त्रीपुत्रादिसुखान्वितः ॥","पंडित, जनप्रिय, धनवान, कामी; स्त्री-पुत्रादि सुख।"],["भाग्येशे भ्रातृभावस्थे जातो भ्रातृसुखान्वितः । धनवान् गुणवांश्चापि रूपशीलसमन्वितः ॥","भ्रातृ-सुख; धनवान, गुणवान, रूप-शील-युक्त।"],["भाग्येशे तुर्यभावस्थे गृहयानसुखान्वितः । सर्वसम्पत्तियुक्तश्च मातृभक्तो भवेन्नरः ॥","गृह-वाहन-सुख; सर्वसंपत्ति; मातृभक्त।"],["भाग्येशे सुतभावस्थे सुतभाग्यसमन्वितः । गुरुभक्तिरतो धीरो धर्मात्मा पण्डितो नरः ॥","पुत्र-भाग्य; गुरुभक्त, धीर, धर्मात्मा, पंडित।"],["भाग्येशे रिपुभावस्थे स्वल्पभाग्यो भवेन्नरः । मातुलादिसुखैर्हीनः शत्रुभिः पीडितः सदा ॥","अल्प भाग्य; मामा आदि का सुख नहीं; शत्रुओं से पीड़ित।"],["भाग्येशे दारभावस्थे दारयोगात् सुखोदयः । गुणवान् कीर्तिमांश्चापि जायते द्विजसत्तमः ॥","दारा-योग से सुख का उदय; गुणी, कीर्तिमान, श्रेष्ठ द्विज।"],["भाग्येशे मृत्युभावस्थे भाग्यहीनो नरो भवेत् । ज्येष्ठभ्रातृसुखं नैव तस्य जातस्य जायते ॥","भाग्य-हीन; ज्येष्ठ भ्राता का सुख नहीं।"],["भाग्येशे भाग्यभावस्थे बहुभाग्यसमन्वितः । गुणसौन्दर्यसम्पन्नो सहजेभ्यः सुखं बहु ॥","बहुत भाग्य; गुण-सौंदर्य; भाई-बहनों से बहुत सुख।"],["भाग्येशे कर्मभावस्थे जातो राजाऽथ तत्समः । मन्त्री सेनापतिर्वाऽपि गुणवान् जनपुजितः ॥","राजा या उसके तुल्य; मंत्री या सेनापति; गुणी, जनपूजित।"],["भाग्येशे लाभभावस्थे धनलाभो दिने दिने । भक्तो गुरुजनानां च गुणवान् पुण्यवानपि ॥","दिन-प्रतिदिन धन-लाभ; गुरुजन-भक्त, गुणी, पुण्यवान।"],["भाग्येशो व्ययभावस्थो भाग्यहानिकरो नृणाम् । शुभकार्ये व्ययो नित्यं निर्धनोऽतिथिसङ्गमात् ॥","भाग्य की हानि; शुभ कार्यों में नित्य व्यय; अतिथि-संग से निर्धन।"],
